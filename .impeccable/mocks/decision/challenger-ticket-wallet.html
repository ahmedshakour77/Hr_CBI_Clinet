<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--stock:#fff;--navy:#1A2B5C;--red:#C8322B;--carbon:#6B4FA0;--ink2:#5D6580;--rule:#D9DCE6;--ground:#EEF0F5}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--navy);font-family:'Cairo',sans-serif}
.head{background:var(--navy);color:#fff;padding:44px 16px 18px}
.head .row{display:flex;justify-content:space-between;align-items:center;height:48px}
.head h1{font-size:18px;font-weight:800}
.seal{width:34px;height:34px;border-radius:50%;border:2px solid #D9906B;display:grid;place-items:center;font-size:11px;color:#F0B89A}
.head p{font-size:13px;opacity:.75;margin-top:6px}
.head h2{font-size:24px;font-weight:800}
.new{margin:16px;height:52px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center}
.coupon{margin:0 16px 12px;background:var(--stock);border-radius:10px;position:relative;overflow:hidden}
.tab{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:6px 14px;display:flex;justify-content:space-between;letter-spacing:.5px}
.body{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;border-bottom:2px dashed var(--rule)}
.f label{display:block;font-size:11px;color:var(--ink2)}
.f b{font-size:15px;color:var(--carbon);font-weight:700}
.f.wide{grid-column:1/-1}.f.wide b{color:var(--navy);font-size:17px}
.stub{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}
.st{font-weight:800;font-size:13px;border:2px solid currentColor;padding:1px 10px;border-radius:4px;transform:rotate(-4deg)}
.ok{color:#2E7D4F}.pend{color:var(--carbon)}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#fff;border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding-top:10px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);width:72px}
.nav i{width:56px;height:30px;border-radius:15px;display:block;border:1.5px solid var(--ink2)}
.nav .on{color:var(--navy);font-weight:800}.nav .on i{background:var(--navy);border-color:var(--navy)}
</style></head><body>
<div class="head"><div class="row"><div class="seal">CBI</div><h1>الموارد البشرية</h1><span style="width:34px"></span></div>
<p>الرقابة المصرفية · الدرجة ٦ / المرحلة ٣</p><h2>أحمد خالد الربيعي</h2></div>
<div class="new">＋ طلب جديد</div>
<div class="coupon"><div class="tab"><span>قسيمة ١ من ٣</span><span>٢٠٢٦/٤١٧</span></div>
 <div class="body"><div class="f wide"><label>نوع الطلب</label><b>إجازة اعتيادية</b></div>
 <div class="f"><label>من</label><b>١٩/١٠</b></div><div class="f"><label>إلى</label><b>٢٣/١٠</b></div></div>
 <div class="stub"><span>قُدِّم ١٢/١٠/٢٠٢٦</span><span class="st pend">قيد التدقيق</span></div></div>
<div class="coupon"><div class="tab"><span>قسيمة ٢ من ٣</span><span>٢٠٢٦/٣٩٨</span></div>
 <div class="body"><div class="f wide"><label>نوع الطلب</label><b>شهادة راتب</b></div>
 <div class="f"><label>الجهة</label><b>مصرف الرافدين</b></div><div class="f"><label>النسخ</label><b>١</b></div></div>
 <div class="stub"><span>صدر ٠٩/١٠/٢٠٢٦</span><span class="st ok">مُصادَق</span></div></div>
<div class="nav"><div class="on"><i></i>الرئيسية</div><div><i></i>طلباتي</div><div><i></i>ملفي</div><div><i></i>الإعدادات</div></div>
</body></html>
