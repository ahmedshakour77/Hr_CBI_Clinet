<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FB;--card:#fff;--ink:#1B1F2A;--ink2:#5F6677;--blue:#1F5FBF;--bluet:#E4ECFA;--rule:#E3E6EE}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans Arabic',sans-serif}
.top{padding:56px 16px 16px;display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;background:var(--bluet);color:var(--blue);display:grid;place-items:center;font-weight:700}
.top p{font-size:13px;color:var(--ink2)}.top h2{font-size:20px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 16px 20px}
.qa div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center}
.qa i{width:56px;height:56px;border-radius:16px;background:var(--bluet);display:block}
h3{font-size:16px;font-weight:700;padding:0 16px 10px}
.card{margin:0 16px 10px;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--rule)}
.card b{font-size:15px}.card span{display:block;font-size:12px;color:var(--ink2)}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#FFF3D6;color:#8A5A00;font-weight:700}
.pill.ok{background:#E2F4E8;color:#1E6B3A}
.bal{margin:10px 16px;background:var(--blue);color:#fff;border-radius:16px;padding:16px}
.bal p{font-size:13px;opacity:.85}.bal b{font-size:28px}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#fff;border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding-top:10px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);width:72px}
.nav i{width:56px;height:30px;border-radius:15px;display:block;border:1.5px solid var(--ink2)}
.nav .on{color:var(--blue);font-weight:700}.nav .on i{background:var(--bluet);border-color:var(--bluet)}
</style></head><body>
<div class="top"><div class="av">أخ</div><div><p>مرحباً</p><h2>أحمد خالد الربيعي</h2></div></div>
<div class="qa"><div><i></i>طلب إجازة</div><div><i></i>كشف الراتب</div><div><i></i>شهادة راتب</div><div><i></i>الحضور</div></div>
<div class="bal"><p>رصيد الإجازات الاعتيادية</p><b>— يوم</b></div>
<h3>الطلبات الأخيرة</h3>
<div class="card"><div><b>إجازة اعتيادية</b><span>١٩–٢٣ تشرين الأول</span></div><span class="pill">قيد التدقيق</span></div>
<div class="card"><div><b>شهادة راتب</b><span>صدرت ٠٩/١٠</span></div><span class="pill ok">مكتمل</span></div>
<div class="nav"><div class="on"><i></i>الرئيسية</div><div><i></i>طلباتي</div><div><i></i>ملفي</div><div><i></i>الإعدادات</div></div>
</body></html>
